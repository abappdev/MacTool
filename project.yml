name: MacTool
options:
  bundleIdPrefix: in.abappdev
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0.0"
targets:
  MacTool:
    type: application
    platform: macOS
    sources:
      - path: MacTool
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.abappdev.MacTool
        PRODUCT_NAME: MacTool
        INFOPLIST_FILE: MacTool/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: MacTool/Resources/MacTool.entitlements
        GENERATE_INFOPLIST_FILE: false
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: true
        DEVELOPMENT_TEAM: "44GWMTNP57"
        CODE_SIGN_STYLE: Automatic
        # Debug may ad-hoc; Release distribution uses scripts/release.sh (Developer ID).
        CODE_SIGN_IDENTITY: "-"
    info:
      path: MacTool/Resources/Info.plist
      properties:
        LSUIElement: true
        NSAccessibilityUsageDescription: >-
          MacTool needs Accessibility access to post tiny (1px) synthetic mouse moves.
          Accessibility is required for posting mouse events.
    entitlements:
      path: MacTool/Resources/MacTool.entitlements
    scheme:
      testTargets:
        - MacToolTests

  MacToolTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/MacToolTests
    dependencies:
      - target: MacTool
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.abappdev.MacToolTests
        GENERATE_INFOPLIST_FILE: true
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MacTool.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/MacTool"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  MacTool:
    build:
      targets:
        MacTool: all
        MacToolTests: [test]
    test:
      targets:
        - MacToolTests
    run:
      config: Debug
